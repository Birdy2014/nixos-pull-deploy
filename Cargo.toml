[package]
name = "nixos-pull-deploy"
version = "0.2.0"
edition = "2024"

[dev-dependencies]
tempfile = "3"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
git2 = { version = "0.21.0", features = ["https", "ssh"] }
libc = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
